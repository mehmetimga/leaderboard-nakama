version: '3.9'

services:
  # Nakama game server
  nakama:
    image: heroiclabs/nakama:3.20.1
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1 --database.address postgres:localdb@postgres:5432/nakama --logger.level DEBUG --session.token_expiry_sec 7200 --console.username admin --console.password password --runtime.path /nakama/data/modules
    restart: always
    links:
      - "postgres:db"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./nakama-module:/nakama/data/modules:ro
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"   # gRPC API
      - "7350:7350"   # HTTP API
      - "7351:7351"   # Console
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL database (shared by Nakama and our app)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb
      POSTGRES_DB: nakama
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"  # Use 5434 to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Leaderboard API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8080"
      NAKAMA_HOST: nakama
      NAKAMA_HTTP_PORT: "7350"
      NAKAMA_GRPC_PORT: "7349"
      NAKAMA_SERVER_KEY: defaultkey
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb
      POSTGRES_DB: nakama
      POSTGRES_SSLMODE: disable
      WORKER_ENABLED: "true"
      WORKER_SNAPSHOT_INTERVAL: "30m"
      SNAPSHOT_LEADERBOARDS: "global_scores,weekly_scores"
    ports:
      - "8080:8080"
    depends_on:
      nakama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # React Web UI
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        VITE_WS_URL: ws://localhost:8080/ws
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
